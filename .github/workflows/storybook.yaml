name: Storybook

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'apps/viewer/**'
      - 'packages/**'
      - '.github/workflows/storybook.yaml'
      - 'yarn.lock'
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  HUSKY: 0
  CI: 1

jobs:
  storybook:
    if: ${{ !github.event.pull_request.draft || github.event.pull_request.requested_reviewers[0] || github.event.pull_request.requested_teams[0] }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/viewer
    env:
      # The secrets context is not allowed in step-level `if`; mirror the
      # token into env so the chromatic step can gate on its presence.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
        working-directory: .
      - name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Build storybook
        run: yarn build-storybook
      - name: Run chromatic
        uses: chromaui/action@latest
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/viewer
          onlyChanged: true
          storybookBuildDir: storybook-static
          exitOnceUploaded: true
