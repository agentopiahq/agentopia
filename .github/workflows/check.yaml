name: Check

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'plugins/**'
      - 'scripts/**'
      - '.github/actions/setup/**'
      - '.github/workflows/check.yaml'
      - 'yarn.lock'
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - review_requested
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  HUSKY: 0
  CI: 1

jobs:
  # One job definition, fanned out by the matrix into parallel jobs. Each job
  # shares its setup through the composite action in .github/actions/setup.
  check:
    name: ${{ matrix.name }}
    if: ${{ !github.event.pull_request.draft || github.event.pull_request.requested_reviewers[0] || github.event.pull_request.requested_teams[0] }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: |
              yarn lint
              yarn format:check
              yarn readmes --check
          - name: Typecheck
            run: yarn typecheck
          - name: Test
            run: yarn test
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
