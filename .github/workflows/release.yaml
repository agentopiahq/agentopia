name: Release

# Changesets drives the release, in two steps:
#   1. Run this workflow by hand (Actions > Release > Run workflow, on main). It
#      gathers the pending changesets into a "Release v<version>" pull request
#      that bumps agentopiahq and writes its changelog, then dispatches Check and Storybook on it (a pull request
#      pushed with GITHUB_TOKEN triggers no pull_request workflows, but a
#      workflow_dispatch from it does). Run it again to refresh that pull request.
#   2. Merging that pull request bumps the packages' versions on main, which
#      starts this workflow on its own: it publishes every version not yet on
#      npm, pushes the tag and creates the GitHub releases.
# Ordinary pushes to main never open a release pull request. See .changeset/README.md.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Only a version bump (the merged "Release v<version>" pull request) can publish.
    paths:
      - 'apps/cli/package.json'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, tags and releases
  pull-requests: write # open the "Release v<version>" pull request
  id-token: write # npm provenance, once the repository is public
  actions: write # dispatch Check and Storybook on the version pull request

env:
  TURBO_TELEMETRY_DISABLED: 1
  HUSKY: 0
  CI: 1

jobs:
  release:
    name: Version or publish
    if: ${{ github.repository == 'agentopiahq/agentopia' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # A push only ever publishes. Changesets merged after the version pull
      # request was last refreshed would otherwise make the action open a new
      # pull request instead, so set them aside in this checkout (nothing is
      # committed); the next hand-run picks them up.
      - name: Set pending changesets aside
        if: ${{ github.event_name == 'push' }}
        run: find .changeset -name '*.md' ! -name README.md -delete
      # The paths filter starts this workflow on any edit to that package.json
      # file (a rename, a dependency), not only a version bump. Publish on a
      # push only when the CLI's version actually changed, so an unreleased
      # 0.0.0 never reaches npm.
      - name: Check for a version bump
        id: bump
        if: ${{ github.event_name == 'push' }}
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { git show "$1:apps/cli/package.json" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).version)}catch{}})'; }
          before=$(version "$BEFORE")
          after=$(version HEAD)
          echo "CLI version: ${before:-none} -> $after"
          if [ -n "$after" ] && [ "$before" != "$after" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "No version bump, so nothing to publish."
          fi
      - name: Set up workspace
        if: ${{ github.event_name != 'push' || steps.bump.outputs.bumped == 'true' }}
        uses: ./.github/actions/setup
      - name: Version pull request, or publish
        id: changesets
        if: ${{ github.event_name != 'push' || steps.bump.outputs.bumped == 'true' }}
        # v2 reads what was published from the Changesets v3 output file
        # (CHANGESETS_OUTPUT, passed down through `yarn release`); v1 parsed
        # v2's stdout, found nothing in v3's, and so pushed no tags and created
        # no releases.
        uses: changesets/action@v2
        with:
          version-script: yarn version-packages
          publish-script: yarn release
          # Only a placeholder: the version isn't known until the version
          # script has run, so the next step retitles it "Release v<version>".
          pr-title: Release
          commit-message: Release
          # Our headings carry a date (`## 0.2.0 - 2026-11-18`), which the
          # action's exact-match lookup can't find, so it would put the whole
          # changelog in each release. It still pushes the tags; the releases
          # and the version pull request's description come from
          # scripts/release-notes.mjs below.
          create-github-releases: false
          push-git-tags: true
        env:
          # Version headings are dated (scripts/changelogs.mjs) in the
          # maintainer's time zone, not the runner's UTC.
          TZ: America/Los_Angeles
          # Changesets publishes with `yarn npm publish`, which reads its token
          # from YARN_NPM_AUTH_TOKEN, not from .npmrc.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          # npm only accepts provenance from a public source repository, and
          # rejects the whole publish otherwise. Sign it whenever this one is
          # public; it turns on by itself when the repository goes public.
          YARN_NPM_PUBLISH_PROVENANCE: ${{ github.event.repository.private == false }}
      - name: Create the GitHub releases
        if: ${{ steps.changesets.outputs.published == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.published-packages }}
        run: node scripts/release-notes.mjs releases "$PUBLISHED"
      - name: Title and describe the version pull request
        if: ${{ steps.changesets.outputs.published != 'true' && steps.changesets.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          version=$(node -p 'require("./apps/cli/package.json").version')
          node scripts/release-notes.mjs pr-body > "$RUNNER_TEMP/version-pr.md"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            -f "title=Release v$version" -F "body=@$RUNNER_TEMP/version-pr.md" --silent
      - name: Run Check and Storybook on the version pull request
        if: ${{ steps.changesets.outputs.published != 'true' && steps.changesets.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          for workflow in check.yaml storybook.yaml; do
            gh workflow run "$workflow" --ref "$VERSION_BRANCH"
          done
