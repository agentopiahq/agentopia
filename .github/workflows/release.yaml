name: Release

# Changesets drives the release. On every push to main:
#   - with pending changesets, it opens (or updates) a "Version packages" pull
#     request that bumps @agentopia/cli and agentopia-town together and writes
#     their changelogs;
#   - with none pending (that is, once that pull request is merged), it publishes
#     any version not yet on npm, pushes the tags and creates the GitHub releases.
# See .changeset/README.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # push the version branch, tags and releases
  pull-requests: write # open the "Version packages" pull request
  id-token: write # npm provenance

env:
  TURBO_TELEMETRY_DISABLED: 1
  HUSKY: 0
  CI: 1

jobs:
  release:
    name: Version or publish
    if: ${{ github.repository == 'tuliren/agentopia' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up workspace
        uses: ./.github/actions/setup
      - name: Version pull request, or publish
        uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
          title: Version packages
          commit: Version packages
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Changesets publishes with `yarn npm publish`, which reads its token
          # from YARN_NPM_AUTH_TOKEN, not from .npmrc.
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_PUBLISH_REGISTRY: https://registry.npmjs.org
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
