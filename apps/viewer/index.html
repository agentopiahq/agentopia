<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>agentopia</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9e2d3;
        overflow: hidden;
        font-family:
          ui-rounded,
          -apple-system,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #hud {
        position: fixed;
        left: 12px;
        top: 10px;
        color: #857863;
        font-size: 13px;
        user-select: none;
      }
      #hud b {
        color: #3f382c;
        font-weight: 600;
      }
      #scrubber {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 12px;
        width: min(560px, 72vw);
        padding: 7px 16px;
        background: #f4eee0;
        border-radius: 999px;
        box-shadow: 0 2px 10px rgba(63, 56, 44, 0.12);
        user-select: none;
      }
      #scrubber.visible {
        display: flex;
      }
      #scrubber-track {
        position: relative;
        flex: 1;
        height: 20px;
        cursor: pointer;
        touch-action: none;
      }
      #scrubber-track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 5px;
        transform: translateY(-50%);
        background: #d9d0bd;
        border-radius: 999px;
      }
      #scrubber-fill {
        position: absolute;
        left: 0;
        top: 50%;
        height: 5px;
        width: 0;
        transform: translateY(-50%);
        background: #a5977c;
        border-radius: 999px;
        pointer-events: none;
      }
      #scrubber-handle {
        position: absolute;
        left: 0;
        top: 50%;
        width: 13px;
        height: 13px;
        transform: translate(-50%, -50%);
        background: #3f382c;
        border-radius: 50%;
        pointer-events: none;
      }
      #scrubber-time {
        color: #857863;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="hud"><b>agentopia</b> <span id="status">connecting…</span></div>
    <div id="scrubber">
      <div id="scrubber-track">
        <div id="scrubber-fill"></div>
        <div id="scrubber-handle"></div>
      </div>
      <span id="scrubber-time">0:00 / 0:00</span>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
