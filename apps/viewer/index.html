<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentopia</title>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e3dac6;
        overflow: hidden;
        font-family:
          ui-rounded,
          -apple-system,
          'Segoe UI',
          system-ui,
          sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #scrubber {
        position: fixed;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 12px;
        width: min(560px, 72vw);
        padding: 7px 16px;
        background: #f4eee0;
        border-radius: 999px;
        box-shadow: 0 2px 10px rgba(63, 56, 44, 0.12);
        user-select: none;
      }
      #scrubber.visible {
        display: flex;
      }
      #scrubber-play,
      #scrubber-prev,
      #scrubber-next,
      #scrubber-golive {
        display: flex;
        flex: none;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: none;
        cursor: pointer;
      }
      #scrubber-play:hover,
      #scrubber-prev:hover,
      #scrubber-next:hover,
      #scrubber-golive:hover {
        background: #e7dfcd;
      }
      /* The go-live button and LIVE badge exist only on a live session. */
      #scrubber-golive,
      #scrubber-live {
        display: none;
      }
      #scrubber.live #scrubber-golive {
        display: flex;
      }
      #scrubber.live #scrubber-live {
        display: flex;
        align-items: center;
        gap: 5px;
        flex: none;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #857863;
        cursor: pointer;
      }
      #scrubber-live::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #a5977c;
      }
      #scrubber-live.at-live {
        color: #c2604a;
        cursor: default;
      }
      #scrubber-live.at-live::before {
        background: #c2604a;
        animation: live-pulse 2s ease-in-out infinite;
      }
      @keyframes live-pulse {
        50% {
          opacity: 0.35;
        }
      }
      /* Go-live is "skip to the end": a triangle against a bar. */
      #scrubber-golive::before {
        content: '';
        width: 0;
        height: 0;
        margin-right: 1px;
        border-left: 9px solid #3f382c;
        border-top: 5.5px solid transparent;
        border-bottom: 5.5px solid transparent;
      }
      #scrubber-golive::after {
        content: '';
        width: 2.5px;
        height: 11px;
        background: #3f382c;
        border-radius: 1px;
      }
      /* Step buttons are double triangles, pointed the way they step. */
      #scrubber-prev::before,
      #scrubber-prev::after {
        content: '';
        width: 0;
        height: 0;
        border-right: 8px solid #3f382c;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      #scrubber-prev::after {
        margin-left: -3px;
      }
      #scrubber-next::before,
      #scrubber-next::after {
        content: '';
        width: 0;
        height: 0;
        border-left: 8px solid #3f382c;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
      }
      #scrubber-next::after {
        margin-left: -3px;
      }
      #scrubber-play::before,
      #scrubber-play::after {
        content: '';
        width: 3px;
        height: 12px;
        margin: 0 1.5px;
        background: #3f382c;
        border-radius: 1px;
      }
      #scrubber-play.paused::before {
        width: 0;
        height: 0;
        margin: 0 0 0 3px;
        background: none;
        border-radius: 0;
        border-left: 11px solid #3f382c;
        border-top: 7px solid transparent;
        border-bottom: 7px solid transparent;
      }
      #scrubber-play.paused::after {
        content: none;
      }
      #scrubber-track {
        position: relative;
        flex: 1;
        height: 20px;
        cursor: pointer;
        touch-action: none;
      }
      #scrubber-track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 5px;
        transform: translateY(-50%);
        background: #d9d0bd;
        border-radius: 999px;
      }
      #scrubber-fill {
        position: absolute;
        left: 0;
        top: 50%;
        height: 5px;
        width: 0;
        transform: translateY(-50%);
        background: #a5977c;
        border-radius: 999px;
        pointer-events: none;
      }
      #scrubber-handle {
        position: absolute;
        left: 0;
        top: 50%;
        width: 13px;
        height: 13px;
        transform: translate(-50%, -50%);
        background: #3f382c;
        border-radius: 50%;
        pointer-events: none;
      }
      #scrubber-markers {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scrubber-marker {
        position: absolute;
        top: 50%;
        width: 2px;
        height: 9px;
        transform: translate(-50%, -50%);
        background: #c3b393;
        border-radius: 1px;
      }
      .scrubber-marker.failed {
        background: #c2604a;
      }
      .scrubber-marker.active {
        height: 13px;
        background: #3f382c;
      }
      #scrubber-tooltip {
        position: absolute;
        bottom: calc(100% + 10px);
        left: 0;
        transform: translateX(-50%);
        display: none;
        max-width: 340px;
        padding: 5px 10px;
        background: #3f382c;
        color: #f4eee0;
        font-size: 12px;
        line-height: 1.35;
        border-radius: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        pointer-events: none;
      }
      #scrubber-tooltip.visible {
        display: block;
      }
      #scrubber-time {
        color: #857863;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      #scrubber-speed {
        flex: none;
        padding: 2px 7px;
        border: none;
        border-radius: 999px;
        background: none;
        color: #3f382c;
        font-size: 12px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        cursor: pointer;
      }
      #scrubber-speed:hover {
        background: #e7dfcd;
      }
      #scrubber-speed-popup {
        position: absolute;
        right: 10px;
        bottom: calc(100% + 10px);
        display: none;
        width: 300px;
        padding: 12px 18px 26px;
        background: #f4eee0;
        border-radius: 14px;
        box-shadow: 0 2px 10px rgba(63, 56, 44, 0.18);
      }
      #scrubber-speed-popup.open {
        display: block;
      }
      #scrubber-speed-header {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: #857863;
        font-size: 11px;
      }
      #scrubber-speed-value {
        color: #3f382c;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      #scrubber-speed-track {
        position: relative;
        height: 20px;
        cursor: pointer;
        touch-action: none;
      }
      #scrubber-speed-track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 4px;
        transform: translateY(-50%);
        background: #d9d0bd;
        border-radius: 999px;
      }
      #scrubber-speed-ticks {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .scrubber-speed-tick {
        position: absolute;
        top: 50%;
        width: 2px;
        height: 8px;
        transform: translate(-50%, -50%);
        background: #c3b393;
        border-radius: 1px;
      }
      .scrubber-speed-label {
        position: absolute;
        top: 17px;
        transform: translateX(-50%);
        color: #857863;
        font-size: 9px;
        font-variant-numeric: tabular-nums;
      }
      #scrubber-speed-handle {
        position: absolute;
        top: 50%;
        width: 12px;
        height: 12px;
        transform: translate(-50%, -50%);
        background: #3f382c;
        border-radius: 50%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="scrubber">
      <button id="scrubber-play" aria-label="Pause"></button>
      <button id="scrubber-prev" aria-label="Previous event"></button>
      <button id="scrubber-next" aria-label="Next event"></button>
      <button id="scrubber-golive" aria-label="Jump to live"></button>
      <div id="scrubber-track">
        <div id="scrubber-fill"></div>
        <div id="scrubber-markers"></div>
        <div id="scrubber-handle"></div>
      </div>
      <span id="scrubber-time">0:00 / 0:00</span>
      <button id="scrubber-speed" aria-label="Playback speed">1×</button>
      <span id="scrubber-live">LIVE</span>
      <div id="scrubber-speed-popup">
        <div id="scrubber-speed-header">
          <span>Speed</span>
          <span id="scrubber-speed-value">1×</span>
        </div>
        <div id="scrubber-speed-track">
          <div id="scrubber-speed-ticks"></div>
          <div id="scrubber-speed-handle"></div>
        </div>
      </div>
      <div id="scrubber-tooltip"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
